<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แผนผังจุดบริการอิเล็กทรอนิกส์ สำนักงานที่ดินจังหวัดลำปาง สาขาแม่ทะ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; color: #333; overflow-x: hidden; }
    .map-wrapper { position: relative; display: inline-block; width: 100%; max-width: 1200px; margin: 0 auto; box-shadow: 0 15px 35px rgba(0,0,0,0.2); border-radius: 16px; overflow: hidden; background-color: #fff; }
    .map-image { width: 100%; height: auto; display: block; }
    
    /* การ์ดใสไร้รอยต่อ กลมกลืนกับภาพ แต่คลิกได้ตามขนาด */
    .hotspot {
      position: absolute;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 5;
      border-radius: 6px;
      transition: all 0.3s ease;
    }
    .hotspot:hover {
      background-color: rgba(13, 110, 253, 0.15);
      box-shadow: inset 0 0 10px rgba(13, 110, 253, 0.3);
    }
    /* ไฮไลท์กรอบจุดบริการที่ถูกเลือกจากปุ่มนำทาง */
    .hotspot.active-target {
      background-color: rgba(220, 53, 69, 0.2);
      border: 2px solid #dc3545;
      box-shadow: 0 0 15px rgba(220, 53, 69, 0.6);
      z-index: 10;
    }

    /* ป้ายชื่อลอยตามเคอร์เซอร์เมาส์เมื่อชี้บริเวณการ์ด */
    #cursorTooltip {
      position: fixed;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      z-index: 99999;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(5px);
      white-space: nowrap;
      transition: transform 0.05s ease-out;
    }

    /* ================= แถบป๊อปอัพนำทางด้านข้าง (Side Navigation Drawer) ================= */
    .nav-drawer {
      position: fixed;
      top: 50%;
      left: 0;
      transform: translate(-100%, -50%);
      width: 290px;
      max-height: 80vh;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 5px 0 25px rgba(0,0,0,0.18);
      border-radius: 0 18px 18px 0;
      z-index: 1050;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(13, 110, 253, 0.2);
      border-left: none;
    }
    .nav-drawer.open {
      transform: translate(0, -50%);
    }
    /* ปุ่มลูกศรซ่อน/แสดงด้านข้างจอ */
    .nav-drawer-toggle {
      position: absolute;
      right: -44px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 96px;
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: #fff;
      border: none;
      border-radius: 0 14px 14px 0;
      box-shadow: 4px 0 15px rgba(13, 110, 253, 0.35);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .nav-drawer-toggle:hover {
      background: linear-gradient(135deg, #0b5ed7, #0a58ca);
    }
    .nav-drawer-toggle i {
      font-size: 18px;
      transition: transform 0.35s ease;
    }
    .nav-drawer.open .nav-drawer-toggle i {
      transform: rotate(180deg);
    }
    .nav-drawer-toggle span {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 1px;
    }
    .nav-drawer-header {
      background: linear-gradient(135deg, #0d6efd, #0b5ed7);
      color: white;
      padding: 14px 16px;
      border-radius: 0 17px 0 0;
    }
    .nav-drawer-body {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
    }
    .nav-spot-btn {
      width: 100%;
      text-align: left;
      margin-bottom: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #1e293b;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-spot-btn:hover {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #0d6efd;
      transform: translateX(4px);
    }
    .nav-spot-btn.active {
      background: #0d6efd;
      border-color: #0d6efd;
      color: #fff;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    /* ================= หมุดเด้ง (Bouncing Pin) บนแผนผัง ================= */
    .bouncing-pin-wrapper {
      position: absolute;
      z-index: 50;
      transform: translate(-50%, -100%);
      pointer-events: auto;
      cursor: pointer;
      display: none;
    }
    .bouncing-pin {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: pinBounce 0.85s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
    }
    .bouncing-pin-label {
      background: #dc3545;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.45);
      margin-bottom: 4px;
      border: 2px solid #fff;
    }
    .bouncing-pin-icon {
      font-size: 42px;
      color: #dc3545;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.35));
      line-height: 1;
    }
    .pin-pulse {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 10px;
      background: rgba(220, 53, 69, 0.5);
      border-radius: 50%;
      animation: pulseRing 1.2s infinite ease-out;
      pointer-events: none;
    }
    @keyframes pinBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-16px); }
    }
    @keyframes pulseRing {
      0% { transform: translateX(-50%) scale(0.6); opacity: 1; }
      100% { transform: translateX(-50%) scale(2.4); opacity: 0; }
    }

    /* Glassmorphism 3D Modal (กระจกใส) */
    .modal-content.glass-modal {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
      transform: perspective(1000px) rotateX(8deg) translateY(-20px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal.show .modal-content.glass-modal {
      transform: perspective(1000px) rotateX(0deg) translateY(0);
      opacity: 1;
    }
    .glass-header {
      background: linear-gradient(135deg, rgba(13, 110, 253, 0.9), rgba(11, 94, 215, 0.95));
      backdrop-filter: blur(10px);
      color: white;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1.25rem 1.75rem;
    }
    .glass-header .btn-close { filter: invert(1); }
    .glass-body { padding: 1.75rem; }
    .glass-description-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-left: 5px solid #0d6efd;
      padding: 1.25rem;
      border-radius: 14px;
      margin-top: 1.25rem;
      box-shadow: 0 10px 30px 0 rgba(31, 38, 135, 0.08);
      color: #2c3e50;
      line-height: 1.7;
    }
    .carousel-item img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    #loadingSpinner { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
  </style>
</head>
<body>

  <!-- Tooltip ลอยตามเคอร์เซอร์ -->
  <div id="cursorTooltip"><i class="fa-solid fa-location-dot me-1 text-warning"></i><span id="tooltipText"></span></div>

  <!-- แถบป๊อปอัพปุ่มนำทางด้านข้างจอ -->
  <div class="nav-drawer" id="navDrawer">
    <button class="nav-drawer-toggle" onclick="toggleNavDrawer()" title="เปิด/ปิดเมนูนำทาง">
      <i class="fa-solid fa-chevron-right"></i>
      <span>นำทาง</span>
    </button>
    <div class="nav-drawer-header">
      <h6 class="m-0 fw-bold"><i class="fa-solid fa-compass me-2"></i>ค้นหาและนำทางจุดบริการ</h6>
      <small class="text-white-50" style="font-size: 12px;">กดเลือกจุดบริการเพื่อปักหมุดนำทางบนแผนผัง</small>
    </div>
    <div class="nav-drawer-body" id="navButtonList">
      <!-- รายการปุ่มนำทางจากคอลัมน์ B จะแสดงที่นี่ -->
    </div>
  </div>

  <div id="loadingSpinner">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <p class="mt-3 text-secondary fw-bold">กำลังโหลดผังจุดบริการ...</p>
  </div>

  <div class="container my-4 text-center">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <button class="btn btn-primary btn-sm shadow-sm" onclick="toggleNavDrawer()">
        <i class="fa-solid fa-location-arrow me-1"></i> เมนูนำทางด่วน
      </button>
      <h2 class="fw-bold text-primary m-0 fs-4 fs-md-2"><i class="fa-solid fa-map-location-dot me-2"></i>แผนที่จุดบริการ</h2>
      <a href="fixpoint.html" class="btn btn-outline-secondary btn-sm shadow-sm"><i class="fa-solid fa-gear me-1"></i> กำหนดพิกัดจุด</a>
    </div>
    <p class="text-muted mb-4">คลิกปุ่มลูกศรด้านซ้ายของหน้าจอเพื่อเลือกเมนูนำทาง หรือคลิกพื้นที่จุดบริการบนภาพผังเพื่อดูรายละเอียด</p>

    <div class="map-wrapper" id="mapWrapper">
      <img src="" id="mainMap" class="map-image" alt="ผังจุดบริการ">
      <div id="hotspotContainer"></div>
      
      <!-- หมุดเด้งแสดงตำแหน่งที่เลือก -->
      <div id="bouncingPinWrapper" class="bouncing-pin-wrapper" title="คลิกเพื่อดูรายละเอียดจุดบริการ">
        <div class="bouncing-pin">
          <div class="bouncing-pin-label" id="bouncingPinLabel"></div>
          <i class="fa-solid fa-location-dot bouncing-pin-icon"></i>
        </div>
        <div class="pin-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Modal Glassmorphism 3D -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content glass-modal">
        <div class="glass-header d-flex justify-content-between align-items-center">
          <h5 class="modal-title fw-bold m-0"><i class="fa-solid fa-circle-info me-2"></i><span id="modalTitle"></span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="glass-body">
          <div id="imageCarousel" class="carousel slide mb-3" data-bs-ride="carousel">
            <div class="carousel-indicators" id="carouselIndicators"></div>
            <div class="carousel-inner" id="carouselInner"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#imageCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#imageCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="glass-description-card">
            <h6 class="fw-bold text-primary mb-2"><i class="fa-solid fa-align-left me-2"></i>รายละเอียดจุดบริการ</h6>
            <div id="modalDescription"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ====================================================================
    // นำ URL ที่ได้จากการ Deploy Google Apps Script (Web App URL) มาใส่ที่นี่
    // ====================================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0pChAIg94KvDimHwrmqIiTWbXLVmhDq_WVqbFegjdDhpJJwKJQ5TwePLLMAQAR1O-/exec';

    let infoModal;
    let allHotspots = [];

    document.addEventListener('DOMContentLoaded', function() {
      infoModal = new bootstrap.Modal(document.getElementById('infoModal'));
      loadMapData();
    });

    function toggleNavDrawer() {
      document.getElementById('navDrawer').classList.toggle('open');
    }

    async function loadMapData() {
      // รองรับทั้งบน GitHub Pages (Fetch API) และใน Google Apps Script
      if (typeof google !== 'undefined' && google.script && google.script.run && SCRIPT_URL.includes('ใส่_URL')) {
        google.script.run.withSuccessHandler(renderMap).withFailureHandler(err => {
          alert('เกิดข้อผิดพลาด: ' + err);
          document.getElementById('loadingSpinner').style.display = 'none';
        }).getData();
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();
        renderMap(data);
      } catch (err) {
        alert('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + err.message);
        document.getElementById('loadingSpinner').style.display = 'none';
      }
    }

    function renderMap(data) {
      if (data.mapUrl) document.getElementById('mainMap').src = data.mapUrl;
      allHotspots = data.hotspots || [];

      const container = document.getElementById('hotspotContainer');
      const navList = document.getElementById('navButtonList');
      container.innerHTML = '';
      navList.innerHTML = '';

      const tooltip = document.getElementById('cursorTooltip');
      const tooltipText = document.getElementById('tooltipText');

      let navCount = 0;

      allHotspots.forEach((spot, index) => {
        // 1. สร้างพื้นที่คลิกบนผัง
        const div = document.createElement('div');
        div.className = 'hotspot';
        div.id = 'hotspot-box-' + index;
        div.style.top = spot.coords.top + '%';
        div.style.left = spot.coords.left + '%';
        div.style.width = spot.coords.width + '%';
        div.style.height = spot.coords.height + '%';
        
        div.addEventListener('mousemove', function(e) {
          tooltipText.innerText = spot.name;
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX + 15) + 'px';
          tooltip.style.top = (e.clientY + 15) + 'px';
        });

        div.addEventListener('mouseleave', function() {
          tooltip.style.display = 'none';
        });

        div.onclick = () => {
          tooltip.style.display = 'none';
          showDetail(spot);
        };

        container.appendChild(div);

        // 2. สร้างปุ่มนำทางในแถบด้านข้าง (เฉพาะรายการที่ติ๊กเลือกแสดงผล)
        if (spot.showNav !== false && spot.name) {
          navCount++;
          const btn = document.createElement('button');
          btn.className = 'nav-spot-btn';
          btn.id = 'nav-btn-' + index;
          btn.innerHTML = `
            <span><i class="fa-solid fa-location-dot text-danger me-2"></i>${spot.name}</span>
            <i class="fa-solid fa-arrow-right text-muted" style="font-size: 12px;"></i>
          `;
          btn.onclick = () => focusOnSpot(spot, index);
          navList.appendChild(btn);
        }
      });

      if (navCount === 0) {
        navList.innerHTML = '<div class="text-center text-muted py-4 small">ยังไม่มีรายการปุ่มนำทางที่เลือกไว้</div>';
      }

      document.getElementById('loadingSpinner').style.display = 'none';
    }

    // ฟังก์ชันแสดงหมุดเด้งไปยังจุดบริการที่เลือก
    function focusOnSpot(spot, index) {
      // ล้างสถานะปุ่มและกรอบเดิม
      document.querySelectorAll('.nav-spot-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active-target'));

      // ไฮไลท์ปุ่มและกรอบที่เลือก
      const activeBtn = document.getElementById('nav-btn-' + index);
      if (activeBtn) activeBtn.classList.add('active');

      const activeBox = document.getElementById('hotspot-box-' + index);
      if (activeBox) activeBox.classList.add('active-target');

      // คำนวณจุดกึ่งกลางของพื้นที่จุดบริการเพื่อวางหมุดเด้ง
      const centerTop = spot.coords.top + (spot.coords.height / 2);
      const centerLeft = spot.coords.left + (spot.coords.width / 2);

      const pinWrapper = document.getElementById('bouncingPinWrapper');
      const pinLabel = document.getElementById('bouncingPinLabel');

      pinLabel.innerText = spot.name;
      pinWrapper.style.top = centerTop + '%';
      pinWrapper.style.left = centerLeft + '%';
      pinWrapper.style.display = 'block';

      // เมื่อคลิกที่หมุดเด้ง ให้เปิดรายละเอียดจุดบริการได้ด้วย
      pinWrapper.onclick = () => showDetail(spot);

      // ปิดแถบเมนูอัตโนมัติบนหน้าจอมือถือเพื่อให้เห็นแผนผังชัดเจน
      if (window.innerWidth < 768) {
        document.getElementById('navDrawer').classList.remove('open');
      }

      // เลื่อนหน้าจอไปยังตำแหน่งหมุดอย่างนุ่มนวล
      pinWrapper.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function showDetail(spot) {
      document.getElementById('modalTitle').innerText = spot.name;
      document.getElementById('modalDescription').innerText = spot.description || 'ไม่มีคำอธิบาย';
      const carouselInner = document.getElementById('carouselInner');
      const carouselIndicators = document.getElementById('carouselIndicators');
      const carouselElem = document.getElementById('imageCarousel');
      carouselInner.innerHTML = '';
      carouselIndicators.innerHTML = '';

      if (spot.images && spot.images.length > 0) {
        carouselElem.style.display = 'block';
        spot.images.forEach((imgUrl, index) => {
          const indicator = document.createElement('button');
          indicator.type = 'button';
          indicator.dataset.bsTarget = '#imageCarousel';
          indicator.dataset.bsSlideTo = index;
          if (index === 0) indicator.className = 'active';
          carouselIndicators.appendChild(indicator);

          const item = document.createElement('div');
          item.className = 'carousel-item' + (index === 0 ? ' active' : '');
          item.innerHTML = `<img src="${imgUrl}" alt="${spot.name}" onerror="this.src='https://via.placeholder.com/600x320?text=Image+Not+Found'">`;
          carouselInner.appendChild(item);
        });
      } else {
        carouselElem.style.display = 'none';
      }
      infoModal.show();
    }
  </script>
</body>
</html>
